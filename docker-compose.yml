services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: idempay
      POSTGRES_USER: idempay
      POSTGRES_PASSWORD: idempay
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idempay -d idempay"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  app:
    build: .
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://idempay:idempay@postgres:5432/idempay
      REDIS_HOST: redis
      REDIS_PORT: 6379
